<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if page.translation_key %}
    <link rel="alternate" hreflang="en" href="{{ site.data.locales.en.routes[page.translation_key] | absolute_url }}">
    <link rel="alternate" hreflang="fr" href="{{ site.data.locales.fr.routes[page.translation_key] | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ site.data.locales.en.routes[page.translation_key] | absolute_url }}">
  {% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if site.theme_config.appearance_toggle %}
    {% include toggle_theme_js.html %}
  {% endif %}
</head>
